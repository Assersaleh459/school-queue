<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
<title>SchoolQ — Activation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f4f8; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #19224A;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 48px 40px; width: 480px;
  }
  .logo { font-size: 28px; font-weight: 800; color: #19224A; }
  .logo span { color: #5FAEB6; }
  .subtitle { font-size: 13px; color: #888; margin-top: 4px; margin-bottom: 28px; }
  h2 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  p.lead { font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 8px;
    font-size: 12px; outline: none; font-family: ui-monospace, monospace;
    resize: vertical; min-height: 96px; transition: border-color 0.15s;
  }
  textarea:focus { border-color: #5FAEB6; }
  #status { margin: 14px 0; font-size: 13px; font-weight: 600; text-align: center; min-height: 20px; }
  .ok { color: #059669; } .err { color: #dc2626; } .info { color: #2563eb; }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; background: #5FAEB6; color: #fff;
  }
  .btn:hover { opacity: 0.88; }
  .mid { margin-bottom: 20px; }
  .mid-label { font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
  .mid-row { display: flex; gap: 8px; }
  .mid-row code {
    flex: 1; font-family: ui-monospace, monospace; font-size: 13px; background: #f3f4f6;
    border-radius: 8px; padding: 10px 12px; word-break: break-all; user-select: all;
  }
  .copy {
    padding: 0 14px; border: 1.5px solid #e5e7eb; border-radius: 8px; background: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; color: #19224A;
  }
  .copy:hover { background: #f9fafb; }
  .notice { background: #fef2f2; color: #991b1b; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">School<span>Q</span></div>
  <div class="subtitle">Software Activation</div>

  <h2>Activate this installation</h2>
  <div class="notice" id="notice"></div>
  <p class="lead">Send the Machine ID below to Vyra Systems — your license key is made for this PC.
    Then paste the key here. Activation works fully offline.</p>

  <div class="mid">
    <div class="mid-label">Machine ID of this PC</div>
    <div class="mid-row">
      <code id="machine">…</code>
      <button class="copy" id="copy" type="button" onclick="copyId()">Copy</button>
    </div>
  </div>

  <label for="key">License Key</label>
  <textarea id="key" placeholder="Paste your license key here…"></textarea>

  <div id="status"></div>
  <button class="btn" onclick="activate()">Activate</button>
</div>

<script>
  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = cls || '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const st = window.electronAPI.licenseStatus();
    if (st && st.machineId) document.getElementById('machine').textContent = st.machineId;
    // An installed license that stopped working (expired, other PC…) — say why
    if (st && st.reason && st.reason !== 'Not activated') {
      const n = document.getElementById('notice');
      n.textContent = st.reason + '. Contact Vyra Systems for a new license key.';
      n.style.display = 'block';
    }
  });

  function copyId() {
    const code = document.getElementById('machine');
    const range = document.createRange();
    range.selectNodeContents(code);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy');
    const b = document.getElementById('copy');
    b.textContent = 'Copied';
    setTimeout(() => { b.textContent = 'Copy'; }, 1500);
  }

  async function activate() {
    const key = document.getElementById('key').value.trim();
    if (!key) { setStatus('Please paste your license key.', 'err'); return; }
    setStatus('Verifying…', 'info');
    const res = await window.electronAPI.activateLicense(key);
    if (res && res.valid) {
      setStatus('✓ Activated for ' + ((res.payload && res.payload.school) || 'your school') + '. Launching…', 'ok');
      setTimeout(() => window.electronAPI.relaunch(), 900);
    } else {
      setStatus('✗ ' + (res && res.reason ? res.reason : 'Activation failed'), 'err');
    }
  }
</script>
</body>
</html>
