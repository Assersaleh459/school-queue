<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
<title>SchoolQ call</title>
<style>
  :root { --navy: #19224A; --teal: #5FAEB6; --amber: #F59E0B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%;
    display: flex; align-items: center; gap: 36px;
    padding: 28px 40px;
    background: rgba(25, 34, 74, 0.94);
    border: 1px solid rgba(95, 174, 182, 0.55);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    color: #fff;
    opacity: 0; transform: translateY(18px) scale(0.98);
    transition: opacity 240ms cubic-bezier(.2,.8,.2,1), transform 240ms cubic-bezier(.2,.8,.2,1);
  }
  .card.show { opacity: 1; transform: none; }
  .card.hide { opacity: 0; transform: translateY(8px); transition-duration: 200ms; transition-timing-function: ease-in; }
  .badge {
    flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 230px; padding: 10px 18px; border-radius: 16px; background: var(--teal); color: var(--navy);
  }
  .badge .label { font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .badge .number { font-size: 64px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .final .badge { background: var(--amber); }
  .text { flex: 1; min-width: 0; }
  .en { font-size: 38px; font-weight: 700; line-height: 1.2; }
  .ar { font-size: 38px; font-weight: 700; line-height: 1.3; direction: rtl; text-align: right; margin-top: 6px; color: #d7ecef; }
  .sub { font-size: 20px; color: #aeb9d8; margin-top: 6px; }
  .announcement .badge .number { font-size: 52px; }
  .announcement .en, .announcement .ar { font-size: 32px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge"><span class="label" id="label"></span><span class="number" id="number"></span></div>
    <div class="text">
      <div class="en" id="en"></div>
      <div class="ar" id="ar"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  // Everything is set with textContent — banner data never becomes HTML.
  window.banner.onShow((d) => {
    const card = $('card');
    const isCall = d.kind === 'call';
    card.className = `card ${isCall ? '' : 'announcement'} ${d.final ? 'final' : ''}`;
    if (isCall) {
      $('label').textContent = d.final ? 'Final call' : 'Now calling';
      $('number').textContent = String(d.ticket || '').split('-').pop();
      $('en').textContent = d.department || '';
      $('ar').textContent = d.departmentAr || '';
      $('sub').textContent = d.room ? `Room ${d.room}  ·  غرفة ${d.room}` : (d.ticket || '');
    } else {
      $('label').textContent = 'Announcement';
      $('number').textContent = '📢';
      $('en').textContent = d.text || '';
      $('ar').textContent = d.textAr || '';
      $('sub').textContent = '';
    }
    requestAnimationFrame(() => card.classList.add('show'));
  });
  window.banner.onHide(() => { $('card').classList.add('hide'); });
</script>
</body>
</html>
